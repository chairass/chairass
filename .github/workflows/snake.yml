name: Gerar cobrinha

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar cobrinha
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: chairass
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff4fa3&color_dots=%23161b22,%232a2f45,%234157a6,%238a5cf6,%23ff4fa3

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
